version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The core has no runtime dependencies on purpose — a harness harder to audit
  # than the tools it audits is worthless. This covers dev tooling only.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
